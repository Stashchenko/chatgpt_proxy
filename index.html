<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ChatGPT Web Proxy</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        .chat-scroll::-webkit-scrollbar {
            width: 6px;
        }

        .chat-scroll::-webkit-scrollbar-thumb {
            background: #374151;
            border-radius: 3px;
        }
    </style>
</head>
<body class="bg-gray-900 text-gray-100 h-screen flex flex-col font-sans">

<!-- Header -->
<header class="border-b border-gray-800 bg-gray-950 p-4 flex items-center justify-between">
    <div class="flex items-center space-x-3">
        <div class="w-3 h-3 rounded-full bg-emerald-500 animate-pulse"></div>
        <h1 class="font-bold text-lg text-white">ChatGPT Persistent Session</h1>
    </div>
    <span class="text-xs text-gray-400 bg-gray-800 px-2.5 py-1 rounded-full">Port 8000</span>
</header>

<!-- Chat Log -->
<main id="chat-log" class="flex-1 overflow-y-auto p-4 space-y-4 chat-scroll max-w-4xl w-full mx-auto">
    <div class="bg-gray-800/50 border border-gray-700/50 rounded-xl p-4 text-sm text-gray-300">
        👋 Session active. Messages sent here directly control the underlying ChatGPT browser session.
    </div>
</main>

<!-- Input Area -->
<footer class="p-4 border-t border-gray-800 bg-gray-950">
    <div class="max-w-4xl mx-auto flex gap-2">
      <textarea
              id="prompt-input"
              rows="1"
              placeholder="Type your message..."
              class="flex-1 bg-gray-900 border border-gray-700 focus:border-emerald-500 rounded-xl px-4 py-3 text-sm focus:outline-none resize-none"
              onkeydown="handleKeyDown(event)"
      ></textarea>
        <button
                id="send-btn"
                onclick="sendMessage()"
                class="bg-emerald-600 hover:bg-emerald-500 font-medium px-5 py-3 rounded-xl text-sm transition-colors flex items-center gap-2 disabled:opacity-50"
        >
            <span>Send</span>
        </button>
    </div>
</footer>

<script>
    const chatLog = document.getElementById('chat-log');
    const promptInput = document.getElementById('prompt-input');
    const sendBtn = document.getElementById('send-btn');

    function appendMessage(role, text) {
        const isUser = role === 'user';
        const msgDiv = document.createElement('div');
        msgDiv.className = `flex flex-col ${isUser ? 'items-end' : 'items-start'} my-2`;

        const bubble = document.createElement('div');
        bubble.className = `max-w-[85%] rounded-2xl px-4 py-3 text-sm whitespace-pre-wrap ${
            isUser
                ? 'bg-emerald-600 text-white rounded-br-none'
                : 'bg-gray-800 border border-gray-700 text-gray-100 rounded-bl-none'
        }`;
        bubble.textContent = text;

        msgDiv.appendChild(bubble);
        chatLog.appendChild(msgDiv);
        chatLog.scrollTop = chatLog.scrollHeight;
        return bubble;
    }

    async function sendMessage() {
        const prompt = promptInput.value.trim();
        if (!prompt) return;

        appendMessage('user', prompt);
        promptInput.value = '';
        promptInput.disabled = true;
        sendBtn.disabled = true;

        const loadingBubble = appendMessage('assistant', 'Thinking...');
        loadingBubble.classList.add('animate-pulse', 'italic', 'text-gray-400');

        try {
            const res = await fetch('/api/chat', {
                method: 'POST',
                headers: {'Content-Type': 'application/json'},
                body: JSON.stringify({prompt})
            });

            const data = await res.json();
            if (res.ok) {
                loadingBubble.textContent = data.response;
                loadingBubble.classList.remove('animate-pulse', 'italic', 'text-gray-400');
            } else {
                loadingBubble.textContent = `Error: ${data.detail || 'Failed to get response'}`;
                loadingBubble.classList.add('text-red-400');
            }
        } catch (err) {
            loadingBubble.textContent = `Network Error: ${err.message}`;
            loadingBubble.classList.add('text-red-400');
        } finally {
            promptInput.disabled = false;
            sendBtn.disabled = false;
            promptInput.focus();
            chatLog.scrollTop = chatLog.scrollHeight;
        }
    }

    function handleKeyDown(e) {
        if (e.key === 'Enter' && !e.shiftKey) {
            e.preventDefault();
            sendMessage();
        }
    }
</script>
</body>
</html>
